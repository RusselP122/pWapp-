name: Update ECMWF IFS TC Tracks
on:
  push:
    branches:
      - main
    paths:
      - 'plot_ifs_tracks.py'
      - '.github/workflows/update_ifs_tracks.yml'
  schedule:
    - cron: '30 2,8,14,20 * * *' # Run 4 times a day, giving time for the data to be ready
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install system dependencies (eccodes and proj)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev proj-data proj-bin
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas ecmwf-opendata eccodes numpy matplotlib cartopy
          
      - name: Download and Process IFS Tracks
        run: |
          python tc_ifs_tracks.py
          
      - name: Generate static map images
        run: |
          python plot_ifs_tracks.py

      - name: Upload images to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID not set, skipping R2 upload."
            exit 0
          fi
          aws s3 sync public/assets/ s3://images/assets/ \
            --endpoint-url https://4f2279a209b84575e7c5d8c9d5c8f5fd.r2.cloudflarestorage.com \
            --exclude "*" --include "ifs_tropical_cyclone_*"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/obfuscate_csvs.py
          git add -f public/data/ifs_tc_latest.dat || true
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update ECMWF IFS TC Tracks and data [skip ci]"
            git pull --rebase origin main
            git push
          fi
