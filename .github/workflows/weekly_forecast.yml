name: Update Weekly Tropical Outlook

on:
  schedule:
    # Runs every Monday, Wednesday, Friday, and Sunday at 8:40 AM PHT (00:40 UTC)
    - cron: '40 0 * * 0,1,3,5'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-weekly-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib cartopy pandas numpy requests scikit-learn scipy
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi

      - name: Run weekly forecast logic
        run: |
          # Running weekly outlook scripts
          python forcast5.py
          python forcast6.py

      - name: Upload weekly forecast images to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID not set, skipping R2 upload."
            exit 0
          fi
          aws s3 sync public/images/ s3://images/images/ \
            --endpoint-url https://4f2279a209b84575e7c5d8c9d5c8f5fd.r2.cloudflarestorage.com

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only JSON data (images are hosted on Cloudflare R2)
          git add public/data/*.json
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update weekly tropical outlook [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
