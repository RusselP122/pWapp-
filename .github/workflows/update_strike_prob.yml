name: Update FNV3 Strike Probability Maps

on:
  schedule:
    # Runs at 01:00, 07:00, 13:00, and 19:00 UTC every day 
    # (Staggered slightly after large ensemble base runs)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  update-strike-prob:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib cartopy pandas numpy requests scikit-learn scipy xarray netCDF4 geojsoncontour

      - name: Run FNV3 Strike Probability logic
        run: |
          python update_strike_prob.py

      - name: Upload risk maps to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID not set, skipping R2 upload."
            exit 0
          fi
          aws s3 sync public/assets/risk_maps/ s3://images/assets/risk_maps/ \
            --endpoint-url https://4f2279a209b84575e7c5d8c9d5c8f5fd.r2.cloudflarestorage.com

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add output GeoJSONs (images are hosted on Cloudflare R2)
          git add -f public/data/strike_prob/*.json || true
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update FNV3 Strike Probability GeoJSON files [skip ci]"
            
            # Retry push up to 5 times to handle transient GitHub server errors
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main
              git push && echo "Push successful!" && break
              echo "Push failed (attempt $i). Waiting before retry..."
              sleep $((15 * i))
            done
          fi
