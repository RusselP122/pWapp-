name: Update GFS Wind + MSLP Maps

on:
  schedule:
    # Runs at 03:30, 09:30, 15:30, 21:30 UTC
    # GFS 00z ready ~3h after init, 06z ready ~9h, 12z ready ~15h, 18z ready ~21h
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  update-gfs-wind:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            matplotlib \
            cartopy \
            numpy \
            scipy \
            requests \
            pydap

      - name: Run GFS Wind + MSLP generator
        run: python wind_gfs.py

      - name: Upload Wind GFS maps to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID not set, skipping R2 upload."
            exit 0
          fi
          aws s3 sync public/images/wind_gfs/ s3://images/images/wind_gfs/ \
            --endpoint-url https://4f2279a209b84575e7c5d8c9d5c8f5fd.r2.cloudflarestorage.com

      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only metadata JSON (images are hosted on Cloudflare R2)
          git add -f public/data/wind_gfs_meta.json || true

          # Commit only if something changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update GFS Wind + MSLP maps [skip ci]"

            # Retry push up to 5 times to handle transient GitHub errors
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main
              git push && echo "Push successful!" && break
              echo "Push failed (attempt $i). Retrying..."
              sleep $((15 * i))
            done
          fi
